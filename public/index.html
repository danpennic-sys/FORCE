<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FORCE — Force Multiplier Voice Engine</title>
  <meta name="description" content="Overlapping voices → machine-readable code. Local compiler. War-room surface." />
  <style>
    :root {
      --bg: #0b0f14; --panel: #121820; --ink: #e8eef5; --muted: #8b9aab;
      --accent: #3dffa8; --warn: #ffb020; --line: #1e2834;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); min-height: 100vh; }
    header { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.25rem; border-bottom: 1px solid var(--line); }
    .mark { font-weight: 800; letter-spacing: 0.12em; color: var(--accent); font-size: 1.1rem; }
    .sub { color: var(--muted); font-size: 0.85rem; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 0; min-height: calc(100vh - 64px); }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
    section { padding: 1rem 1.25rem; border-right: 1px solid var(--line); }
    section:last-child { border-right: none; }
    h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 0.75rem; }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.75rem; }
    button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); padding: 0.55rem 0.9rem; border-radius: 6px; cursor: pointer; font: inherit; }
    button.primary { border-color: var(--accent); color: var(--accent); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #transcript, #code { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 0.75rem; min-height: 12rem; font-family: var(--mono); font-size: 0.85rem; white-space: pre-wrap; word-break: break-word; }
    #code { color: var(--accent); }
    .pill { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; background: #1a2430; color: var(--muted); font-size: 0.75rem; }
    .pill.live { color: var(--warn); border: 1px solid var(--warn); }
  </style>
</head>
<body>
  <header>
    <div class="mark">FORCE</div>
    <div class="sub">Force multiplier — room voices → machine-readable code</div>
    <span id="micState" class="pill">mic idle</span>
  </header>
  <main>
    <section>
      <h2>Room input</h2>
      <div class="row">
        <button id="btnListen" class="primary" type="button">Listen</button>
        <button id="btnStop" type="button" disabled>Stop</button>
        <button id="btnDemo" type="button">Demo utterances</button>
        <button id="btnClear" type="button">Clear</button>
      </div>
      <p class="sub">Browser Web Speech API (local). Overlapping lines merge per speaker window, then compile offline.</p>
      <h2>Transcript</h2>
      <div id="transcript"></div>
    </section>
    <section>
      <h2>Compiled code</h2>
      <div id="code">// press Listen or Demo</div>
    </section>
  </main>
  <script type="module" src="./force-browser.js"></script>
</body>
</html>
